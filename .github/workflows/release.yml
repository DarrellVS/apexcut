name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Create the release first, with the CHANGELOG section as its body (= the app's “What’s new”).
      # electron-builder then uploads into this one release; letting it create the release itself
      # produced two releases per tag (one per target) with the blockmap stranded in the second.
      - run: node scripts/release-notes.mjs > RELEASE_NOTES.md
      - run: gh release create ${{ github.ref_name }} --title "ApexCut ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # build the installers without publishing, verify the packed app (unpacked requires resolve,
      # app-update.yml present), then upload installer, portable exe, blockmap and latest.yml
      # (the auto-update feed) to the release created above
      - run: npx electron-vite build && npx electron-builder --win --publish never
      - run: node scripts/check-package.mjs dist/win-unpacked
      - run: gh release upload ${{ github.ref_name }} dist/ApexCut-*-setup.exe dist/ApexCut-*-setup.exe.blockmap dist/ApexCut-*-portable.exe dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
