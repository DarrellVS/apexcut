name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # Create the release first, with the CHANGELOG section as its body (= the app's “What’s new”).
      # electron-builder then uploads into this one release; letting it create the release itself
      # produced two releases per tag (one per target) with the blockmap stranded in the second.
      - run: node scripts/release-notes.mjs > RELEASE_NOTES.md
      - run: gh release create ${{ github.ref_name }} --title "ApexCut ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # pack once, verify the unpacked worker files resolve their requires, then build the installers
      # from that packed folder; electron-builder publishes installer, portable exe, blockmap and latest.yml
      - run: npx electron-vite build && npx electron-builder --win --dir
      - run: node scripts/check-package.mjs dist/win-unpacked
      - run: npx electron-builder --win --publish always --prepackaged dist/win-unpacked
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
