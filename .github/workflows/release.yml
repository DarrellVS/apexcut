name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      # electron-builder publishes the installer, portable exe and latest.yml (auto-update feed)
      - run: npx electron-vite build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # the CHANGELOG section becomes the release body = the app's “What’s new”
      - run: node scripts/release-notes.mjs > RELEASE_NOTES.md
      - run: gh release edit ${{ github.ref_name }} --notes-file RELEASE_NOTES.md --title "ApexCut ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
