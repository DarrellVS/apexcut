<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ApexCut: social card</title>
    <meta name="robots" content="noindex" />
    <!-- the source of assets/img/og-card.jpg; rendered once at 1200 x 630 -->
    <link rel="stylesheet" href="assets/css/style.css" />
    <style>
      /* 1200 x 630, screenshotted once to make assets/img/og-card.jpg */
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        isolation: isolate;
      }
      .card img.shot {
        position: absolute;
        inset: 0 -10% 0 42%;
        width: 68%;
        height: 100%;
        object-fit: cover;
        object-position: 58% 45%;
        z-index: -2;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 26%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 26%);
      }
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          90deg,
          var(--bg) 34%,
          rgba(11, 12, 14, 0.72) 58%,
          transparent 92%
        );
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 30px;
        font-size: 26px;
        font-weight: 640;
        letter-spacing: -0.02em;
      }
      .mark img {
        width: 46px;
        height: 46px;
        border-radius: 12px;
      }
      .card h1 {
        max-width: 15ch;
        margin: 0 0 22px;
        font-size: 74px;
        line-height: 1.02;
      }
      .card p {
        max-width: 30ch;
        margin: 0;
        font-size: 25px;
        line-height: 1.45;
        color: var(--fg-2);
      }
      .card .foot {
        position: absolute;
        left: 72px;
        bottom: 56px;
        font-size: 19px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg-3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="shot" src="assets/img/hero-ride.webp" alt="" />
      <div class="mark"><img src="assets/img/icon.png" alt="" /> ApexCut</div>
      <h1>Your best corners, already found.</h1>
      <p>
        Your helmet camera already knows where the good bits are. ApexCut reads them and makes the
        movie.
      </p>
      <div class="foot">Free · Windows · open source</div>
    </div>
  </body>
</html>
